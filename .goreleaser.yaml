builds:
  - main: ./cmd/konfirm
    binary: konfirm
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc

brews:
  - repository:
      owner: Jaehyeon1020
      name: konfirm
    homepage: https://github.com/Jaehyeon1020/konfirm
    description: "Confirm your kubectl"
    license: "MIT"
    install: |
      bin.install "konfirm"

      zsh_output = Utils.safe_popen_read(bin/"konfirm", "completion", "zsh")
      (buildpath/"_konfirm").write zsh_output
      zsh_completion.install "_konfirm"
    caveats: |
      \e[33;1mZsh completion requires compinit and loading konfirm's completion script.
      Copy and run this:\e[0m

      \e[33m{
        echo ''
        echo '# konfirm setup'
        echo 'autoload -Uz compinit && compinit'
        echo 'source <(konfirm completion zsh)'
      } >> ~/.zshrc

      source ~/.zshrc\e[0m
    test: |
      assert_match version.to_s, shell_output("#{bin}/konfirm version")
